[project]
name = "ai-trends"
version = "0.1.0"
description = "Time-series charts tracking AI capability, compute, economics, research, and adoption"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trends"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
