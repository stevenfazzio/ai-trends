name: Update data and deploy

on:
  schedule:
    # 06:20 UTC daily. Late enough that the previous US trading day's filings
    # and Indeed's overnight push have landed.
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Belt and braces against a self-retrigger. The primary guard is that a
    # push made with GITHUB_TOKEN never starts a workflow run at all; this
    # covers the case where the job is ever given a different credential.
    paths-ignore:
      - "data/**"
      - "cache/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch data and assemble site
        run: uv run python -m ai_trends.build

      - name: Commit today's snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cache
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            # No [skip ci] marker: it is redundant given the guards above, and
            # leaving it on main appeared to suppress the workflow run for the
            # *next* push, which meant same-day changes never deployed.
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
